<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대북클럽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --coral:#FF8FA3;
    --coral-dark:#FF6B85;
    --peach:#FFC9A8;
    --lavender:#B9AEEA;
    --mint:#7FDDC4;
    --gold:#FFB13D;
    --paper:#FFFFFF;
    --paper-dark:#FFE7E0;
    --bg:#FFF8F3;
    --ink:#3A2E2A;
    --ink-soft:#9A897F;
    --danger:#E5675A;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; min-height:100vh;}
  .app{max-width:1040px;margin:0 auto;padding:0 20px 80px;}
  header{background:linear-gradient(135deg,#FFD9E2 0%,#FFE7D2 55%,#FFF4E4 100%); padding:50px 20px 64px; margin:0 0 -34px 0; position:relative; overflow:hidden; border-radius:0 0 36px 36px;}
  header::before{content:""; position:absolute; top:-70px; right:-60px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 70%);}
  header::after{content:""; position:absolute; bottom:-90px; left:-50px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,0) 70%);}
  .header-inner{max-width:1040px;margin:0 auto;position:relative;z-index:2;}
  .eyebrow{font-size:13px; letter-spacing:.16em; color:var(--coral-dark); text-transform:uppercase; font-weight:800; margin:0 0 10px;}
  h1{font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(34px,5vw,50px); color:var(--ink); margin:0 0 12px; letter-spacing:-.02em;}
  .sub{color:#8A6F63; font-size:15px; max-width:520px; line-height:1.6; margin:0;}
  .notice{background:rgba(255,255,255,.6); border:1.5px solid rgba(255,255,255,.85); border-radius:12px; padding:10px 14px; font-size:13px; color:#7A5C4E; max-width:560px; line-height:1.6; margin:14px 0 0;}
  .stat-row{display:flex; gap:28px; margin-top:26px; flex-wrap:wrap;}
  .stat{color:var(--ink);}
  .stat b{font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:26px; color:var(--coral-dark); display:block;}
  .stat span{font-size:12px; color:#9A7E70;}
  .panel{background:var(--paper); border-radius:var(--radius); box-shadow:0 2px 8px rgba(255,143,163,.08), 0 14px 30px rgba(255,143,163,.14); border:1.5px solid #FFEFEA; position:relative; z-index:3;}
  .add-panel{padding:28px; margin-bottom:34px;}
  .add-panel h2{font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:20px; margin:0 0 4px; color:var(--ink);}
  .add-panel .hint{color:var(--ink-soft); font-size:13px; margin:0 0 18px;}
  .search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  input[type=text], input[type=search], input[type=date], textarea{font-family:'Noto Sans KR',sans-serif; border:1.5px solid var(--paper-dark); border-radius:14px; padding:12px 14px; font-size:14.5px; color:var(--ink); background:#FFFBF8; width:100%;}
  input:focus, textarea:focus{outline:2px solid var(--coral); outline-offset:1px; border-color:var(--coral);}
  input[type=date]{font-family:inherit; line-height:1.3;}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(48%) sepia(93%) saturate(1749%) hue-rotate(316deg) brightness(101%) contrast(101%); opacity:.75; cursor:pointer; padding:2px;}
  input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1;}
  button{font-family:'Noto Sans KR',sans-serif; cursor:pointer; border:none; border-radius:999px; font-weight:800; font-size:14px; padding:11px 20px; transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease;}
  button:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#fff; box-shadow:0 6px 16px rgba(255,107,133,.32);}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(255,107,133,.4);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn-ghost{background:#fff; color:var(--coral-dark); border:1.5px solid var(--paper-dark);}
  .btn-ghost:hover{background:#FFF3EF;}
  .search-results{display:flex; flex-direction:column; gap:8px; margin-bottom:8px; max-height:280px; overflow-y:auto;}
  .search-item{display:flex; gap:12px; padding:9px; border-radius:14px; cursor:pointer; align-items:center; border:1.5px solid transparent;}
  .search-item:hover{background:#FFF3EF; border-color:var(--paper-dark);}
  .search-item img{width:36px; height:52px; object-fit:cover; border-radius:8px; background:var(--paper-dark); flex-shrink:0;}
  .search-item .meta b{font-size:13.5px; display:block; line-height:1.3;}
  .search-item .meta span{font-size:12px; color:var(--ink-soft);}
  .picked-book{display:flex; gap:14px; align-items:center; background:#FFF3EF; border-radius:16px; padding:12px; margin-bottom:16px;}
  .picked-book img{width:46px; height:66px; object-fit:cover; border-radius:10px;}
  .picked-book .meta b{display:block; font-size:14.5px;}
  .picked-book .meta span{font-size:12.5px; color:var(--ink-soft);}
  .picked-book button{margin-left:auto;}
  .field-row{display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .field{flex:1; min-width:160px;}
  .field label{font-size:12.5px; font-weight:800; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .star-input{position:relative; display:inline-block; font-size:28px; line-height:1; letter-spacing:4px; user-select:none;}
  .star-input-bg{color:#FFE3CC; white-space:nowrap;}
  .star-input-fg{position:absolute; top:0; left:0; overflow:hidden; white-space:nowrap; color:var(--gold); width:0%; pointer-events:none;}
  .star-input-hits{position:absolute; top:0; left:0; width:100%; height:100%; display:flex;}
  .star-input-hits span{flex:1; cursor:pointer;}
  .star-display{position:relative; display:inline-block; white-space:nowrap;}
  .star-display-bg{color:#FFE3CC;}
  .star-display-fg{position:absolute; top:0; left:0; overflow:hidden; white-space:nowrap; color:var(--gold);}
  textarea{min-height:80px; resize:vertical; line-height:1.5;}
  .tabs{display:flex; gap:8px; margin:0 0 20px;}
  .tab{padding:9px 18px; border-radius:999px; font-size:13.5px; font-weight:800; background:#fff; color:var(--ink-soft); border:1.5px solid var(--paper-dark);}
  .tab.active{background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#fff; border-color:transparent;}
  .year-group{margin-bottom:32px;}
  .year-group:last-child{margin-bottom:0;}
  .year-title{font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:17px; color:var(--coral-dark); margin:0 0 14px; display:flex; align-items:center; gap:10px;}
  .year-title::after{content:""; flex:1; height:1px; background:var(--paper-dark);}
  .shelf-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:20px 16px;}
  .shelf-book{cursor:pointer;}
  .shelf-cover{width:100%; aspect-ratio:2/3; border-radius:16px; overflow:hidden; background:var(--paper-dark); box-shadow:0 8px 18px rgba(255,143,163,.2); position:relative; margin-bottom:8px; transition:transform .15s ease;}
  .shelf-book:hover .shelf-cover{transform:translateY(-4px) rotate(-1deg);}
  .shelf-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .shelf-cover .no-cover{display:flex; align-items:center; justify-content:center; height:100%; font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:12px; color:var(--ink-soft); padding:8px; text-align:center; background:linear-gradient(135deg,#FFE7D2,#FFD9E2);}
  .shelf-cover .count-badge{position:absolute; top:6px; right:6px; background:var(--coral-dark); color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px;}
  .shelf-title{font-size:13px; font-weight:700; line-height:1.35; margin:0 0 2px;}
  .shelf-author{font-size:11.5px; color:var(--ink-soft); margin:0 0 4px;}
  .shelf-rating{font-size:12px; color:var(--gold); font-weight:800;}
  .feed-item{padding:20px 0; border-bottom:1px solid var(--paper-dark); display:flex; gap:16px;}
  .feed-item:last-child{border-bottom:none;}
  .feed-cover{width:56px; height:80px; border-radius:12px; object-fit:cover; background:var(--paper-dark); flex-shrink:0;}
  .feed-body{flex:1; min-width:0;}
  .feed-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;}
  .feed-title{font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:16px; margin:0; color:var(--ink);}
  .feed-author{font-size:12.5px; color:var(--ink-soft); margin:2px 0 6px;}
  .feed-reviewer{font-size:12.5px; color:#7C6FD8; font-weight:800;}
  .reviewer-link{cursor:pointer;}
  .reviewer-link:hover{text-decoration:underline;}
  .feed-date{font-size:11.5px; color:#C2A99C;}
  .feed-stars{color:var(--gold); font-size:14px; margin:4px 0 6px;}
  .feed-review{font-size:14px; line-height:1.65; color:#4A3D36; white-space:pre-wrap;}
  .review-actions{display:flex; gap:8px; margin-top:10px;}
  .mini-delete, .mini-edit{display:inline-block; background:transparent; font-size:11.5px; font-weight:700; padding:5px 12px; border:1.5px solid #FFD9D3;}
  .mini-delete{color:var(--danger);}
  .mini-delete:hover{background:#FFF1EF;}
  .mini-delete.confirming{background:var(--danger); color:#fff; border-color:var(--danger);}
  .mini-edit{color:var(--coral-dark); border-color:var(--paper-dark);}
  .mini-edit:hover{background:#FFF3EF;}
  .edit-form{margin-top:10px; padding:14px; background:#FFF7F4; border-radius:14px; border:1.5px solid var(--paper-dark);}
  .edit-form .star-input{margin-bottom:10px;}
  .edit-form input[type=date]{width:auto; margin-bottom:10px;}
  .edit-form textarea{margin-bottom:10px;}
  .edit-actions{display:flex; gap:8px;}
  .edit-actions button{padding:8px 16px; font-size:13px;}
  .add-review{margin-top:18px; padding-top:18px; border-top:1.5px dashed var(--paper-dark);}
  .add-review-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .add-review-title{font-weight:800; font-size:14px; margin:0; color:var(--ink);}
  .add-review-head .btn-ghost{padding:6px 14px; font-size:12px;}
  .add-review input[type=text], .add-review input[type=date]{margin-bottom:10px;}
  .add-review textarea{margin-bottom:10px; min-height:60px;}
  .add-review .star-input{margin-bottom:10px;}
  .my-review-fab-wrap{position:sticky; bottom:0; display:flex; justify-content:flex-end; margin-top:18px; padding-top:14px;}
  .my-review-fab-wrap .my-review-toggle{box-shadow:0 8px 20px rgba(255,107,133,.4);}
  .reaction-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .reaction-btn{background:#fff; border:1.5px solid var(--paper-dark); color:var(--ink-soft); font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:999px;}
  .reaction-btn:hover{background:#FFF3EF;}
  .reaction-btn.active{background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#fff; border-color:transparent;}
  .reply-section{margin-top:10px; padding-left:14px; border-left:2px solid var(--paper-dark);}
  .reply-item{font-size:12.5px; margin-bottom:6px; line-height:1.5;}
  .reply-item b{color:#7C6FD8; margin-right:6px;}
  .reply-item .mini-delete{font-size:10.5px; padding:2px 8px; margin-left:6px; border-radius:999px;}
  .reply-toggle{background:transparent; color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:4px 2px;}
  .reply-toggle:hover{color:var(--coral-dark);}
  .reply-add{display:flex; gap:6px; margin-top:6px;}
  .reply-add input{flex:1; padding:8px 10px; font-size:12.5px; margin-bottom:0;}
  .reply-add button{padding:8px 14px; font-size:12px; flex-shrink:0;}
  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty b{display:block; font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:18px; color:var(--ink); margin-bottom:6px;}
  .modal-back{position:fixed; inset:0; background:rgba(58,46,42,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal-back.open{display:flex;}
  .modal{background:#fff; border-radius:24px; max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:26px;}
  .modal-head{display:flex; gap:16px; margin-bottom:18px;}
  .modal-head img{width:70px; height:100px; object-fit:cover; border-radius:12px; background:var(--paper-dark);}
  .modal-head h3{font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:20px; margin:0 0 4px; color:var(--ink);}
  .modal-head p{font-size:13px; color:var(--ink-soft); margin:0 0 6px;}
  .modal-avg{color:var(--gold); font-weight:800; font-size:14px;}
  .modal-close{margin-left:auto; align-self:flex-start;}
  .modal-review{padding:14px 0; border-top:1px solid var(--paper-dark);}
  .modal-review:first-of-type{border-top:none;}
  .mr-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .mr-top b{color:#7C6FD8;}
  .mr-stars{color:var(--gold); font-size:12.5px; margin-bottom:4px;}
  .mr-text{font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#fff; padding:13px 24px; border-radius:999px; font-size:13.5px; font-weight:700; opacity:0; transition:all .25s ease; z-index:60; pointer-events:none; box-shadow:0 8px 20px rgba(255,107,133,.35);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media (max-width:520px){ .field-row{flex-direction:column;} header{padding:38px 16px 56px;} }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <p class="eyebrow">✨ Book Club Archive</p>
    <h1>대북클럽</h1>
    <p class="sub">매달 한 번, 스쳐 지나가던 책 소개를 여기에 쌓아둡니다. 내가 읽은 책, 별점, 한 줄 이상의 생각을 남기고 서로의 서재를 구경하세요.</p>
    <p class="notice">📢주의📢 이름은 별명, 실명 다 가능합니다. 다만, 꼭! 한 개로 통일해 주세요. 이름을 기준으로 내 서재 및 수정이 가능합니다.</p>
    <div class="stat-row" id="statRow"></div>
  </div>
</header>

<div class="app">

  <div class="panel add-panel">
    <h2>새 책 기록하기</h2>
    <p class="hint">제목으로 검색해서 책을 고른 뒤, 별점과 리뷰를 남겨주세요.</p>

    <div class="search-row">
      <input type="search" id="searchInput" placeholder="책 제목이나 저자를 검색해보세요 (예: 아몬드)">
      <button class="btn-primary" id="searchBtn">검색</button>
      <button class="btn-ghost" id="manualToggleBtn">직접 입력</button>
    </div>
    <div class="search-results" id="searchResults"></div>

    <div id="manualBox" style="display:none; background:var(--paper); border-radius:8px; padding:14px; margin-bottom:14px;">
      <div class="field-row" style="margin-bottom:10px;">
        <div class="field">
          <label for="manualTitle">책 제목</label>
          <input type="text" id="manualTitle" placeholder="예: 아몬드">
        </div>
        <div class="field">
          <label for="manualAuthor">저자</label>
          <input type="text" id="manualAuthor" placeholder="예: 손원평">
        </div>
      </div>
      <button class="btn-primary" id="manualPickBtn">이 책으로 선택</button>
    </div>

    <div id="pickedBookBox"></div>

    <div class="field-row">
      <div class="field">
        <label for="nameInput">내 이름</label>
        <input type="text" id="nameInput" placeholder="예: 지은">
      </div>
      <div class="field">
        <label for="dateInput">읽은 날짜</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>별점 <span style="font-weight:400;color:var(--ink-soft);">(반개도 가능해요)</span></label>
        <div class="star-input" id="starPicker" data-value="0">
          <div class="star-input-bg">★★★★★</div>
          <div class="star-input-fg" style="width:0%">★★★★★</div>
          <div class="star-input-hits">
            <span data-v="1"></span><span data-v="2"></span><span data-v="3"></span><span data-v="4"></span><span data-v="5"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label for="reviewInput">리뷰 <span style="font-weight:400;color:var(--ink-soft);">(선택)</span></label>
      <textarea id="reviewInput" placeholder="이 책에 대해 하고 싶은 이야기를 남겨주세요."></textarea>
    </div>
    <button class="btn-primary" id="submitBtn" disabled>서재에 기록하기</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="shelf">📚 책장</button>
    <button class="tab" data-tab="feed">🕒 최신 피드</button>
    <button class="tab" data-tab="myshelf">🙋 내 서재</button>
  </div>

  <div id="shelfView"></div>
  <div id="feedView" style="display:none;"></div>
  <div id="myShelfView" style="display:none;"></div>

</div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================================================
   여기 두 줄만 Supabase 값으로 바꿔주세요.
   Supabase 대시보드 > Settings > API 에서 확인할 수 있어요.
====================================================== */
const SUPABASE_URL = 'https://xoexagijjqyzcxfwyvpw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvZXhhZ2lqanF5emN4Znd5dnB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MDM3NzgsImV4cCI6MjEwMTQ3OTc3OH0.3kVqrn2BKR3MjcKTfhejsvGUC4pMgYt3R9fpZSsQkKw';
/* ====================================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));

let entries = [];
let reactions = [];
let replies = [];
let pickedBook = null;
let editingId = null;
let currentModalBook = null;
let myReviewFormOpen = false;
let openReplyBoxes = new Set();
const REACTIONS = [
  { emoji: '🥹', label: '감동' },
  { emoji: '👍', label: '공감' },
  { emoji: '❤️', label: '하트' },
  { emoji: '🤣', label: '웃음' }
];

function setPickerValue(container, val){
  container.dataset.value = val;
  container.querySelector('.star-input-fg').style.width = (val/5*100) + '%';
}
function getPickerValue(container){
  return parseFloat(container.dataset.value) || 0;
}
function starsDisplayHtml(rating){
  const pct = Math.max(0, Math.min(5, rating)) / 5 * 100;
  return `<span class="star-display"><span class="star-display-bg">★★★★★</span><span class="star-display-fg" style="width:${pct}%">★★★★★</span></span>`;
}

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Supabase 데이터 ----------
async function loadEntries(){
  const [entriesRes, reactionsRes, repliesRes] = await Promise.all([
    sb.from('entries').select('*').order('created_at', { ascending:false }),
    sb.from('reactions').select('*'),
    sb.from('replies').select('*').order('created_at', { ascending:true })
  ]);
  if(entriesRes.error){
    console.error(entriesRes.error);
    showToast('목록을 불러오는 중 오류가 발생했어요.');
    return;
  }
  entries = entriesRes.data || [];
  reactions = reactionsRes.data || [];
  replies = repliesRes.data || [];
  render();
}

async function toggleReaction(entryId, emoji, myName){
  const existing = reactions.find(r=>r.entry_id===entryId && r.emoji===emoji && r.reactor.trim()===myName);
  if(existing){
    const { error } = await sb.from('reactions').delete().eq('id', existing.id);
    if(error){ console.error(error); showToast('오류가 발생했어요.'); return false; }
  }else{

let searchDebounceTimer = null;
$('#searchInput').addEventListener('input', ()=>{
  clearTimeout(searchDebounceTimer);
  const q = $('#searchInput').value.trim();
  if(!q){ $('#searchResults').innerHTML=''; return; }
  searchDebounceTimer = setTimeout(runSearch, 400);
});
$('#searchInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ clearTimeout(searchDebounceTimer); runSearch(); } });
$('#searchBtn').addEventListener('click', ()=>{ clearTimeout(searchDebounceTimer); runSearch(); });

async function runSearch(){
  const q = $('#searchInput').value.trim();
  const box = $('#searchResults');
  if(!q){ box.innerHTML=''; return; }
  box.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);padding:6px;">검색 중...</p>';
  try{
    const res = await fetch('/api/search-book?q=' + encodeURIComponent(q));
    const data = await res.json();
    if($('#searchInput').value.trim() !== q) return;
    const items = data.items || [];
    if(items.length===0){
      box.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);padding:6px;">검색 결과가 없어요. "직접 입력"을 이용해주세요.</p>';
      return;
    }
    box.innerHTML = '';
    items.forEach(it=>{
      const div = document.createElement('div');
      div.className = 'search-item';
      div.innerHTML = `
        ${it.thumbnail ? `<img src="${it.thumbnail}">` : `<div style="width:36px;height:52px;background:var(--paper-dark);border-radius:3px;flex-shrink:0;"></div>`}
        <div class="meta">
          <b>${escapeHtml(it.title)}</b>
          <span>${escapeHtml(it.author||'저자 미상')}</span>
        </div>`;
      div.addEventListener('click', ()=>pickBook(it.title, it.author, it.thumbnail));
      box.appendChild(div);
    });
  }catch(e){
    if($('#searchInput').value.trim() !== q) return;
    box.innerHTML = '<p style="font-size:13px;color:var(--danger);padding:6px;">검색 중 오류가 발생했어요. "직접 입력"으로 책을 추가해주세요.</p>';
  }
}

// ---------- 렌더 ----------
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function groupByBook(list){
  const map = new Map();
  list.forEach(e=>{
    const key = e.title.trim().toLowerCase()+'|'+(e.author||'').trim().toLowerCase();
    if(!map.has(key)) map.set(key, {title:e.title, author:e.author, thumbnail:e.thumbnail, reviews:[]});
    map.get(key).reviews.push(e);
  });
  return Array.from(map.values());
}

function bookYear(b){
  const dates = b.reviews.map(r => r.read_date || r.created_at).filter(Boolean).sort();
  return new Date(dates[0]).getFullYear();
}

function bookCardHtml(b){
  const avg = (b.reviews.reduce((s,r)=>s+r.rating,0)/b.reviews.length).toFixed(1);
  return `
    <div class="shelf-book" data-key="${escapeHtml(b.title)}|${escapeHtml(b.author||'')}">
      <div class="shelf-cover">
        ${b.thumbnail ? `<img src="${b.thumbnail}">` : `<div class="no-cover">${escapeHtml(b.title)}</div>`}
        <div class="count-badge">${b.reviews.length}명</div>
      </div>
      <p class="shelf-title">${escapeHtml(b.title)}</p>
      <p class="shelf-author">${escapeHtml(b.author||'')}</p>
      <p class="shelf-rating">★ ${avg}</p>
    </div>`;
}

function renderShelfInto(el, list, emptyTitle, emptyBody){
  const books = groupByBook(list).sort((a,b)=> b.reviews.length - a.reviews.length || a.title.localeCompare(b.title));
  if(books.length===0){
    el.innerHTML = `<div class="panel empty"><b>${emptyTitle}</b>${emptyBody}</div>`;
    return;
  }
  const byYear = new Map();
  books.forEach(b=>{
    const y = bookYear(b);
    if(!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(b);
  });
  const years = Array.from(byYear.keys()).sort((a,b)=>b-a);
  el.innerHTML = years.map(y=>`
    <div class="year-group">
      <h3 class="year-title">${y}년</h3>
      <div class="shelf-grid">${byYear.get(y).map(bookCardHtml).join('')}</div>
    </div>`).join('');

  $$('.shelf-book', el).forEach(card=>{
    card.addEventListener('click', ()=>{
      const [title, author] = card.dataset.key.split('|');
      openBookModal(title, author);
    });
  });
}

    const isMine = myName && r.replier.trim()===myName;
    return `<div class="reply-item"><b class="reviewer-link" data-reviewer="${escapeHtml(r.replier)}">${escapeHtml(r.replier)}</b>${escapeHtml(r.text)}${isMine ? `<button class="mini-delete" data-type="reply" data-label="삭제" data-id="${r.id}">삭제</button>` : ''}</div>`;

  currentModalBook = {title, author};
  const myName = ($('#nameInput').value || '').trim();
  const avg = (related.reduce((s,r)=>s+r.rating,0)/related.length).toFixed(1);
  const thumb = related[0].thumbnail;
  $('#modalContent').innerHTML = `
    <div class="modal-head">

      <div>
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(author)}</p>
        <p class="modal-avg">★ ${avg} · 리뷰 ${related.length}개</p>

      <button class="btn-ghost modal-close" id="closeModal">닫기</button>
    </div>
    <div>${related.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(r=>{
      const isMine = myName && r.reviewer.trim()===myName;
      const editing = editingId === r.id;
      return `
      <div class="modal-review">
        <div class="mr-top"><b class="reviewer-link" data-reviewer="${escapeHtml(r.reviewer)}">${escapeHtml(r.reviewer)}</b><span>${new Date(r.read_date || r.created_at).getMonth()+1}월 ${new Date(r.read_date || r.created_at).getDate()}일</span></div>

function refreshViews(){
  if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
  render();
}

document.body.addEventListener('click', async (e)=>{
  const link = e.target.closest('.reviewer-link');
  if(link){ openReviewerModal(link.dataset.reviewer); return; }

  const starHit = e.target.closest('.star-input-hits span');
  if(starHit){
    const container = starHit.closest('.star-input');
    const idx = parseInt(starHit.dataset.v);
    const rect = starHit.getBoundingClientRect();
    const isLeftHalf = (e.clientX - rect.left) < rect.width/2;
    const val = isLeftHalf ? idx - 0.5 : idx;
    setPickerValue(container, val);
    if(container.id === 'starPicker') updateSubmitState();
    return;
  }

  const editBtn = e.target.closest('.mini-edit');
  if(editBtn){
    editingId = Number(editBtn.dataset.id);
    refreshViews();
    return;
  }

  const cancelBtn = e.target.closest('.cancel-edit');
  if(cancelBtn){
    editingId = null;
    refreshViews();
    return;
  }

  const saveBtn = e.target.closest('.save-edit');
  if(saveBtn){
    const id = Number(saveBtn.dataset.id);
    const form = saveBtn.closest('.edit-form');
    const rating = getPickerValue(form.querySelector('.star-input'));
    const read_date = form.querySelector('.edit-date').value;
    const review = form.querySelector('.edit-review').value.trim();
    if(!rating || !read_date){ showToast('별점과 날짜를 입력해주세요.'); return; }
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중...';
    const ok = await updateEntry(id, { rating, read_date, review });
    if(ok){
      editingId = null;
      showToast('수정했어요.');
      await loadEntries();
      if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
    }else{
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
    }
    return;
  }

  const reactionBtn = e.target.closest('.reaction-btn');
  if(reactionBtn){
    const myName = ($('#nameInput').value || '').trim();
    if(!myName){ showToast('먼저 내 이름을 입력해주세요.'); return; }
    reactionBtn.disabled = true;
    const entryId = Number(reactionBtn.dataset.entryId);
    const emoji = reactionBtn.dataset.emoji;
    const ok = await toggleReaction(entryId, emoji, myName);
    if(ok){
      saveMyName(myName);
      await loadEntries();
      if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
    }else{
      reactionBtn.disabled = false;
    }
    return;
  }

  const replyToggleBtn = e.target.closest('.reply-toggle');
  if(replyToggleBtn){
    openReplyBoxes.add(Number(replyToggleBtn.dataset.entryId));
    refreshViews();
    return;
  }

  const replySubmitBtn = e.target.closest('.reply-submit');
  if(replySubmitBtn){
    const entryId = Number(replySubmitBtn.dataset.entryId);
    const input = replySubmitBtn.closest('.reply-add').querySelector('.reply-input');
    const text = input.value.trim();
    const myName = ($('#nameInput').value || '').trim();
    if(!myName){ showToast('먼저 내 이름을 입력해주세요.'); return; }
    if(!text) return;
    replySubmitBtn.disabled = true;
    const ok = await addReply(entryId, myName, text);
    if(ok){
      saveMyName(myName);
      openReplyBoxes.delete(entryId);
      await loadEntries();
      if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
    }else{
      replySubmitBtn.disabled = false;
    }
    return;
  }

  const myReviewToggleBtn = e.target.closest('.my-review-toggle');
  if(myReviewToggleBtn){
    myReviewFormOpen = true;
    refreshViews();
    return;
  }

  const myReviewCloseBtn = e.target.closest('.my-review-close');
  if(myReviewCloseBtn){
    myReviewFormOpen = false;
    refreshViews();
    return;
  }

  const myReviewSubmitBtn = e.target.closest('.my-review-submit');
  if(myReviewSubmitBtn){
    if(!currentModalBook) return;
    const box = myReviewSubmitBtn.closest('.add-review');
    const name = box.querySelector('.my-review-name').value.trim();
    const date = box.querySelector('.my-review-date').value;
    const rating = getPickerValue(box.querySelector('.star-input'));
    const review = box.querySelector('.my-review-text').value.trim();
    if(!name || !date || !rating){ showToast('이름, 날짜, 별점을 입력해주세요.'); return; }
    const related = entries.find(x=>x.title.trim().toLowerCase()===currentModalBook.title.trim().toLowerCase() && (x.author||'').trim().toLowerCase()===currentModalBook.author.trim().toLowerCase());
    myReviewSubmitBtn.disabled = true;
    myReviewSubmitBtn.textContent = '저장 중...';
    const ok = await insertEntry({
      title: currentModalBook.title,
      author: currentModalBook.author,
      thumbnail: related ? related.thumbnail : '',
      reviewer: name,
      rating: rating,
      review: review,
      read_date: date
    });
    if(ok){
      saveMyName(name);
      $('#nameInput').value = name;
      myReviewFormOpen = false;
      showToast('서재에 기록했어요 📖');
      await loadEntries();
      if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
    }else{
      myReviewSubmitBtn.disabled = false;
      myReviewSubmitBtn.textContent = '서재에 기록하기';
    }
    return;
  }

  const del = e.target.closest('.mini-delete');
  if(del){
    const isReply = del.dataset.type === 'reply';
    const defaultLabel = del.dataset.label || '삭제하기';
    if(!del.classList.contains('confirming')){
      del.classList.add('confirming');
      del.textContent = '정말요?';
      clearTimeout(del._resetTimer);
      del._resetTimer = setTimeout(()=>{
        del.classList.remove('confirming');
        del.textContent = defaultLabel;
      }, 3000);
      return;
    }
    clearTimeout(del._resetTimer);
    del.disabled = true;
    del.textContent = '삭제 중...';
    const ok = isReply ? await deleteReply(Number(del.dataset.id)) : await deleteEntry(Number(del.dataset.id));
    if(ok){
      showToast('삭제했어요.');
      if(!isReply) closeModal();
      await loadEntries();
      if(currentModalBook) openBookModal(currentModalBook.title, currentModalBook.author);
    }else{
      del.disabled = false;
      del.classList.remove('confirming');
      del.textContent = defaultLabel;
    }
  }
});

document.body.addEventListener('keydown', (e)=>{
  if(e.target.classList && e.target.classList.contains('reply-input') && e.key==='Enter'){
    e.preventDefault();
    e.target.closest('.reply-add').querySelector('.reply-submit').click();
  }
});

// ---------- 시작 ----------
loadMyName();
setDefaultDate();
loadEntries();
</script>

</body>
</html>
